[package]
name = "registry_cleaner"
edition = "2021"
description = "注册表清理工具 - 搜索并删除注册表中的匹配项"
license = "MIT"
keywords = ["registry", "cleaner", "windows", "cleanup"]
categories = ["command-line-utilities", "windows"]

[dependencies]
winreg = "0.55"
winapi = { version = "0.3", features = [
    "securitybaseapi",
    "winnt",
] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"